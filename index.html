function getCellClass(val) {
  if (val === 0) return 'zero';
  if (val <= 45) return 'low';
  if (val <= 60) return 'mid';
  if (val <= 90) return 'high';
  return 'peak';
}

const table = document.getElementById('heatmapTable');
// Header row
let headerRow = '<tr><th style="width:48px;"></th>';
for (let d = 1; d <= 31; d++) {
  headerRow += `<th>${d}</th>`;
}
headerRow += '</tr>';
table.innerHTML = headerRow;

const tooltip = document.getElementById('tooltip');

const todayNow = new Date();
const todayMonthLabel = (todayNow.getMonth() + 1) + '月';
const todayDay = todayNow.getDate();

months.forEach(m => {
  const data = dailyData[m];
  let row = `<tr><td class="month-label">${m}</td>`;
  for (let d = 0; d < 31; d++) {
    if (d < data.length) {
      const val = data[d];
      const cls = getCellClass(val);
      const label = val > 0 ? val : '';
      const isToday = (m === todayMonthLabel && d + 1 === todayDay);
      row += `<td class="heatmap-cell ${cls}${isToday ? ' today' : ''}" data-month="${m}" data-day="${d+1}" data-val="${val}">${label}</td>`;
    } else {
      row += `<td class="heatmap-cell empty"></td>`;
    }
  }
  row += '</tr>';
  table.innerHTML += row;
});

});

// ============================================================
// DATE RANGE PARSER — checks if today falls in a training's date range
// ============================================================
function parseSingleDate(str, fallbackMonth) {
  str = str.trim();
  const md = str.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (md) return { m: parseInt(md[1]), d: parseInt(md[2]) };
  const dOnly = str.match(/^(\d{1,2})$/);
  if (dOnly) return { m: fallbackMonth, d: parseInt(dOnly[1]) };
  return null;
}

function isActiveToday(datesStr, tabMonthNum) {
  const now = new Date();
  const tm = now.getMonth() + 1;
  const td = now.getDate();

  // Handle "X月（週一~五）" — entire month active
  const fullMonthMatch = datesStr.match(/^(\d{1,2})月/);
  if (fullMonthMatch) return parseInt(fullMonthMatch[1]) === tm;

  // Split on "、" for multiple segments
  const parts = datesStr.split('、');
  for (let part of parts) {
    part = part.trim().replace(/\s/g, '');
    if (!part) continue;

    const hasTilde = part.includes('～') || part.includes('~');
    if (hasTilde) {
      const sep = part.includes('～') ? '～' : '~';
      const idx = part.indexOf(sep);
      const startStr = part.slice(0, idx);
      const endStr   = part.slice(idx + sep.length);
      const start = parseSingleDate(startStr, tabMonthNum);
      if (!start) continue;
      const end = parseSingleDate(endStr, start.m);  // end with no month → inherit start month
      if (!end) continue;
      const sv = start.m * 100 + start.d;
      const ev = end.m   * 100 + end.d;
      const tv = tm      * 100 + td;
      if (tv >= sv && tv <= ev) return true;
    } else {
      const date = parseSingleDate(part, tabMonthNum);
      if (date && date.m === tm && date.d === td) return true;
    }
  }
  return false;
}

function badgeClass(v) {
  if (v >= 60) return 'badge-red';
  if (v >= 30) return 'badge-orange';
  if (v >= 15) return 'badge-yellow';
  return 'badge-green';
}

function renderDetail() {
  const m = selectedMonth;
  const data = dailyData[m];
  const total = monthlyTotals[m];
  const peaks = peakDaysCounts[m];
  const maxDay = data.indexOf(Math.max(...data)) + 1;
  const maxVal = Math.max(...data);
  const activeDays = data.filter(v => v > 0).length;

  // Peak days list
  const peakDaysList = data.map((v,i) => ({day: i+1, val: v})).filter(x => x.val > 60);

  let html = `
    <div class="mini-stats">
      <div class="mini-stat"><div class="mini-stat-val">${total.toLocaleString()}</div><div class="mini-stat-lbl">月調用人天</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${peaks}</div><div class="mini-stat-lbl">超60人天數</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${maxVal}</div><div class="mini-stat-lbl">${maxDay}日最高人數</div></div>
      <div class="mini-stat"><div class="mini-stat-val">${activeDays}</div><div class="mini-stat-lbl">有訓練天數</div></div>
    </div>`;

  if (peakDaysList.length > 0) {
    html += `<div style="margin-bottom:12px;"><span style="font-size:11px;font-weight:700;color:#718096;margin-right:8px;">超過60人日期：</span>`;
    html += peakDaysList.map(p =>
      `<span class="peak-day-pill" style="background:#822727;color:white;">${m.replace('月','')}/${p.day}（${p.val}人）</span>`
    ).join(' ');
    html += `</div>`;
  }

  // Training table
  const tabMonthNum = parseInt(m.replace('月', ''));
  const list = trainings[m] || [];
  if (list.length > 0) {
    html += `<table class="training-table">
      <thead><tr>
        <th style="width:50%;">訓練名稱</th>
        <th>日期</th>
        <th>每日人數</th>
      </tr></thead><tbody>`;
    const _now = new Date();
    const _wk = ['日','一','二','三','四','五','六'][_now.getDay()];
    const _todayStr = `${_now.getMonth() + 1}/${_now.getDate()}（${_wk}）`;
    list.forEach(t => {
      const active = isActiveToday(t.dates, tabMonthNum);
      const todayTag = active ? `<span class="active-today-label">▶ 今日進行中</span>` : '';
      const todayDate = active ? `<div class="today-date-mark">📍 今日 ${_todayStr}</div>` : '';
      html += `<tr class="${active ? 'active-today' : ''}">
        <td>${t.name}${todayTag}</td>
        <td style="color:#718096;font-size:11px;">${t.dates}${todayDate}</td>
        <td><span class="badge ${badgeClass(t.daily)}">${t.daily} 人</span></td>
      </tr>`;
    });
    html += `</tbody></table>`;
  } else {
    html += `<div style="color:#a0aec0;text-align:center;padding:20px;">本月無訓練資料</div>`;
  }

  detailContainer.innerHTML = html;
}
